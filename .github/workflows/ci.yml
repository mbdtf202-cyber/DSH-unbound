name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      # 第一道门：全严格类型检查。
      # 这不是"风格检查"——它能挡住未定义标识符（原项目 skills.js 的 fs、
      # schema.js 的 LEGACY_STAGE_MAP 就是这类 bug，运行时才炸且被 catch 吞掉）。
      - name: typecheck (strict)
        run: npm run typecheck

      # 第二道门：补丁表自身完整性（重复 id、空 pattern、非法正则）。
      - name: verify patch table
        run: npm run verify:patches

      # 第三道门：行为测试。
      - name: test
        run: npm test

      # 可选门：如果 checkout 了 dsh-qilin，校验补丁表与它一致。
      # 没有就直接跳过——不能因为外部私有仓库不可达而让 CI 红。
      - name: cross-repo patch table sync (optional)
        continue-on-error: true
        run: |
          if [ -n "$QILIN_PATH" ] && [ -d "$QILIN_PATH/lib" ]; then
            node scripts/sync-patches.mjs verify --qilin "$QILIN_PATH"
          else
            echo "dsh-qilin not checked out; skipping cross-repo verification"
          fi
        env:
          QILIN_PATH: ${{ github.workspace }}/../dsh-qilin

      # 第四道门：构建产物必须可用（bin 能跑、help 正常）。
      - name: build
        run: npm run build

      # 第二道半：浏览器产物与源码同步。
      #
      # `client.js` 是**提交进 git 的构建产物**（`files` 里声明了它，
      # 宿主按 `exports["./client"]` 找它）。提交产物的代价是"改了源码忘了
      # 重建"会悄悄发出一个旧产物 —— 而这个门禁把它变成可见的红灯。
      #
      # 注意这一步**只比对、不写盘**（`--check`）。要重建请本地跑
      # `npm run build:client` 并把结果一起提交。
      - name: verify client artifact is up to date
        run: npm run check:client


      - name: smoke test CLI
        run: |
          node dist/cli/index.js --help
          node dist/cli/index.js hosts || true
          node dist/cli/index.js targets --ai-base /nonexistent || true

  min-node:
    name: min supported node (22.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # engines 声明 >=22.15，这里实际在该版本跑一遍。
      # 依据 GitHub Actions 实测矩阵：
      #   node:sqlite  从 22.15 起存在（22.5/22.9/22.12 均 ERR_UNKNOWN_BUILTIN_MODULE）
      #   FTS5         从 22.18 起存在（22.15 无 fts5 → store 走 LIKE 降级）
      # 所以 22.15 是「能用但覆盖降级路径」的关键版本，必须进矩阵。
      - run: npm run typecheck
      - run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: coverage
        run: npm run test:cov
