name: probe-sqlite
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.5", "22.9", "22.12", "22.15", "22.18", "22.22"]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: probe node:sqlite
        run: |
          echo "node $(node -v)"
          node -e 'try{require("node:sqlite");console.log("SQLITE_PRESENT")}catch(e){console.log("SQLITE_ABSENT:", e.code)}'
          node -e 'try{const {DatabaseSync}=require("node:sqlite");const d=new DatabaseSync(":memory:");d.exec("CREATE VIRTUAL TABLE t USING fts5(x)");console.log("FTS5_PRESENT")}catch(e){console.log("FTS5_ABSENT:", e.message.slice(0,60))}'
